# Bambu Lab P1S status card.
#
# A button-card whose `content` custom field builds the whole layout as an HTML
# string in JavaScript, plus a chips row underneath for the chamber light and
# pause/resume.
#
# REPLACE BEFORE USE:
#   <printer> — your printer's device prefix. The ha-bambulab integration names
#               entities sensor.<model>_<serial>_<thing>, so yours will look
#               like p1s_01p00c590900937 or x1c_00m09a361800428.
#               One find-and-replace covers the JS constant and the four direct
#               entity references in the chips row.
#
# Entities it reads, with your prefix substituted:
#   sensor.<printer>_print_progress    sensor.<printer>_current_stage
#   sensor.<printer>_nozzle_temperature  sensor.<printer>_bed_temperature
#   sensor.<printer>_remaining_time    sensor.<printer>_current_file
#   image.<printer>_cover_image        light.<printer>_chamber_light
#   button.<printer>_pause_printing    button.<printer>_resume_printing

type: vertical-stack
card_mod:
  style: |
    ha-card {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
    }
cards:
  - type: custom:button-card
    entity: sensor.<printer>_print_progress
    show_name: false
    show_icon: false
    show_state: false
    custom_fields:
      content: |
        [[[
          const p = '<printer>';
          const s = (id) => states[`sensor.${p}_${id}`]?.state ?? '';

          const stage    = s('current_stage');
          const progress = Math.min(parseFloat(s('print_progress')) || 0, 100);
          const file     = s('current_file') || 'No file';
          const imgUrl   = states[`image.${p}_cover_image`]?.attributes?.entity_picture || '';

          const rawTime = s('remaining_time');
          let timeH = '--', timeM = '';
          if (rawTime && rawTime !== 'unknown' && rawTime !== '0') {
            const m = rawTime.match(/(\d+)h\s*(\d+)m/);
            if (m) {
              const h = parseInt(m[1]), mn = parseInt(m[2]);
              if (h > 0) { timeH = `${h}h`; timeM = `${String(mn).padStart(2,'0')}m`; }
              else { timeH = `${mn}m`; timeM = ''; }
            }
          }

          const fmtT = (id) => {
            const n = parseFloat(s(id));
            return isNaN(n) ? '--' : `${Math.round(n)}°C`;
          };

          const layer = s('current_layer');
          const total = s('total_layer_count');
          const layerStr = layer && layer !== 'unknown' ? `${layer}/${total}` : '--';

          const sl = stage.toLowerCase();
          let dotCol = '#22c55e', dotGlow = '0 0 6px #22c55e88';
          let bBg = '#14261a', bFg = '#4ade80', bBr = '#166534';
          if (sl.includes('pause')) {
            dotCol = '#f59e0b'; dotGlow = '0 0 6px #f59e0b88';
            bBg = '#2a1f06'; bFg = '#fbbf24'; bBr = '#854d0e';
          } else if (sl !== 'printing') {
            dotCol = '#64748b'; dotGlow = 'none';
            bBg = '#1e2430'; bFg = '#94a3b8'; bBr = '#334155';
          }

          const R = 44, circ = +(2 * Math.PI * R).toFixed(2);
          const offset = +(circ * (1 - progress / 100)).toFixed(2);

          const chip = (label, value, col) => `
            <div style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 12px;">
              <div style="font-size:10px;color:var(--secondary-text-color);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px;">${label}</div>
              <div style="font-size:17px;font-weight:500;color:${col};">${value}</div>
            </div>
          `;

          return `
            <div style="font-family:'Roboto','Noto Sans',sans-serif;padding:16px;">

              <!-- Header -->
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
                <div style="display:flex;align-items:center;gap:9px;">
                  <div style="width:9px;height:9px;border-radius:50%;background:${dotCol};box-shadow:${dotGlow};flex-shrink:0;"></div>
                  <span style="font-size:15px;font-weight:600;color:var(--primary-text-color);letter-spacing:0.02em;">BAMBU P1S</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:11px;padding:4px 10px;border-radius:20px;letter-spacing:0.1em;font-weight:500;background:${bBg};color:${bFg};border:1px solid ${bBr};">${stage.replace(/_/g,' ').toUpperCase()}</span>
                  ${imgUrl ? `<img src="${imgUrl}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);" />` : ''}
                </div>
              </div>

              <!-- Ring + Time -->
              <div style="display:flex;align-items:center;gap:24px;margin-bottom:20px;">
                <div style="position:relative;width:108px;height:108px;flex-shrink:0;">
                  <svg width="108" height="108" viewBox="0 0 108 108" style="transform:rotate(-90deg);display:block;">
                    <circle cx="54" cy="54" r="${R}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="9"/>
                    <circle cx="54" cy="54" r="${R}" fill="none" stroke="#f97316" stroke-width="9"
                      stroke-linecap="round"
                      stroke-dasharray="${circ}"
                      stroke-dashoffset="${offset}"/>
                  </svg>
                  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1;">
                    <span style="display:block;font-size:24px;font-weight:600;color:#f97316;text-shadow:0 0 14px rgba(249,115,22,0.5);">${Math.round(progress)}%</span>
                    <span style="display:block;font-size:10px;color:var(--secondary-text-color);letter-spacing:0.05em;margin-top:3px;">done</span>
                  </div>
                </div>
                <div>
                  <div style="font-size:32px;font-weight:300;color:var(--primary-text-color);line-height:1;letter-spacing:-0.01em;">
                    ${timeH}${timeM ? `&nbsp;<span style="font-size:28px;">${timeM}</span>` : ''}
                  </div>
                  <div style="font-size:11px;color:var(--secondary-text-color);text-transform:uppercase;letter-spacing:0.12em;margin-top:5px;">Remaining</div>
                </div>
              </div>

              <!-- Chips -->
              <div style="display:flex;gap:8px;margin-bottom:16px;">
                ${chip('Nozzle', fmtT('nozzle_temperature'), '#f97316')}
                ${chip('Bed', fmtT('bed_temperature'), '#fb923c')}
                ${chip('Layer', layerStr, '#fdba74')}
              </div>

              <!-- Footer -->
              <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,0.07);padding-top:12px;gap:8px;">
                <div style="display:flex;align-items:center;gap:6px;overflow:hidden;">
                  <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                    <path d="M2 1h7l3 3v9H2V1z"/><path d="M9 1v3h3"/>
                  </svg>
                  <span style="font-size:12px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${file}</span>
                </div>
                <span style="font-size:12px;color:var(--secondary-text-color);white-space:nowrap;flex-shrink:0;">
                  Layer <span style="color:var(--primary-text-color);font-weight:500;">${layer || '--'}</span>/${total || '--'}
                </span>
              </div>

            </div>
          `;
        ]]]
    card_mod:
      style: |
        ha-card {
          border-radius: 16px 16px 0 0 !important;
          border: 1px solid rgba(249,115,22,0.2) !important;
          border-bottom: 1px solid rgba(255,255,255,0.06) !important;
          box-shadow: 0 0 28px rgba(249,115,22,0.1) !important;
        }
    styles:
      card:
        - padding: '0'
        - background: >-
            var(--ha-card-background, var(--card-background-color,
            white))
      grid:
        - grid-template-columns: 1fr
        - grid-template-areas: '"content"'
        - width: 100%
      custom_fields:
        content:
          - width: 100%
          - min-width: '0'
          - padding: '0'
          - box-sizing: border-box
  - type: custom:mushroom-chips-card
    alignment: center
    card_mod:
      style: |
        ha-card {
          border-radius: 0 0 16px 16px !important;
          border: 1px solid rgba(249,115,22,0.2) !important;
          border-top: none !important;
          box-shadow: 0 8px 28px rgba(249,115,22,0.1) !important;
          padding: 10px 16px 12px !important;
        }
    chips:
      - type: entity
        entity: light.<printer>_chamber_light
        icon: mdi:lightbulb-on
        tap_action:
          action: toggle
        card_mod:
          style: |
            :host {
              --chip-background: rgba(255,255,255,0.05);
            }
      - type: conditional
        conditions:
          - entity: sensor.<printer>_current_stage
            state: printing
        chip:
          type: template
          icon: mdi:pause-circle
          content: Pause
          icon_color: orange
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.<printer>_pause_printing
      - type: conditional
        conditions:
          - entity: sensor.<printer>_current_stage
            state: pause
        chip:
          type: template
          icon: mdi:play-circle
          content: Resume
          icon_color: green
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.<printer>_resume_printing
