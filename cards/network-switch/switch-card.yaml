# The assembled 16-port switch card.
#
# One stack-in-card glass shell holds a header and sixteen port_row instances.
# The rows are transparent and borderless — the shell supplies the glass, and
# hairlines separate the rows. See theme/ for why only the outer card gets the
# backdrop-filter.
#
# REPLACE BEFORE USE:
#   <switch> — your switch's entity prefix. Appears in the header's up-count
#              loop and in all sixteen instantiations below.
#
# Requires the `port_row` Streamline template (see port-row.yaml).
#
# Expects three sensors per port, numbered 1..16:
#   sensor.<switch>_port_<n>_status        state "1" when the link is up
#   sensor.<switch>_port_<n>_speed         link speed in Mbps
#   sensor.<switch>_port_<n>_description   friendly label for what's plugged in

type: custom:stack-in-card
mode: vertical
card_mod:
  style: |
    ha-card {
      background: rgba(255,255,255,0.04) !important;
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08) !important;
      border-radius: 22px !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06) !important;
      overflow: hidden !important;
    }
cards:
  # --- Header, with a live count of how many ports are up --------------------
  - type: markdown
    text_only: true
    content: >-
      {%- set ns = namespace(up=0) -%}

      {%- for i in range(1, 17) -%}

      {%- if is_state('sensor.<switch>_port_' ~ i ~ '_status', '1')
      -%}{%- set ns.up = ns.up + 1 -%}{%- endif -%}

      {%- endfor -%}

      ### NETWORK SWITCH <span class="cnt">{{ ns.up }}/16</span>
    card_mod:
      style: |
        ha-card {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          padding: 16px 18px 12px 18px !important;
        }
        ha-card h3 {
          font-size: 12px !important;
          font-weight: 600 !important;
          color: rgba(255,255,255,0.45) !important;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin: 0 !important;
        }
        ha-card h3 .cnt {
          float: right;
          font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: rgba(0,221,184,0.7);
        }

  # --- Ports 1–16 ------------------------------------------------------------
  # Tedious, but explicit. Lovelace has no loop construct in a view.
  #
  # port_number is quoted so the leading zero survives — it is a label, not a
  # number, and the entity IDs use the unpadded index.
  - type: custom:streamline-card
    template: port_row
    variables:
      port_number: '01'
      description_entity: sensor.<switch>_port_1_description
      speed_entity: sensor.<switch>_port_1_speed
      status_entity: sensor.<switch>_port_1_status
  - type: custom:streamline-card
    template: port_row
    variables:
